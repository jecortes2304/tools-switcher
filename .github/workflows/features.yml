name: Feature validation
on:
  push:
    branches-ignore: [main, develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - run: npm --prefix frontend ci
      - run: wails3 generate bindings -ts -i
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend exec playwright install chromium
      - run: npm --prefix frontend run test:ui
      - run: go test ./...
      - run: go test -race ./internal/...
        env:
          CGO_ENABLED: '1'
      - run: go vet ./...
      - run: go build -o bin/tools-switcher.exe .
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ github.sha }}
          path: source.zip
          retention-days: 15
          if-no-files-found: error



