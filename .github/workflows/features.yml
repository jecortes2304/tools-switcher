name: Feature validation
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, develop]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: feature-${{ github.event_name == 'push' && 'source' || 'validation' }}-${{ github.head_ref || github.ref_name }}${{ github.event.action == 'edited' && '-title' || '' }}
  cancel-in-progress: true
jobs:
  validate-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/release.mjs title
  validate:
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'edited')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - run: npm --prefix frontend ci
      - run: wails3 generate bindings -ts -i
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
      - if: runner.os == 'Windows'
        run: npm --prefix frontend exec playwright install chromium
      - if: runner.os == 'Windows'
        run: npm --prefix frontend run test:ui
      - if: runner.os == 'Windows'
        run: go test ./cmd/ci -run TestWindowsSigningWithSelfSignedCertificate -count=1 -timeout 90s
        env:
          TOOLS_SWITCHER_SIGNING_TEST: '1'
      - run: node --test scripts/release.test.mjs
      - run: node scripts/release.mjs version
      - run: go test ./...
      - run: go test -race ./internal/...
        env:
          CGO_ENABLED: '1'
      - run: go vet ./...
      - run: go build -o bin/tools-switcher.exe .
  validate-release:
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'edited')
    name: Validate release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-release-tools
      - name: Generate and verify a signed release manifest
        run: go test ./cmd/ci -run '^TestReleaseManifestAndChecksums$' -count=1 -v

  archive-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: source-${{ github.sha }}
          path: source.zip
          retention-days: 15
          if-no-files-found: error
