name: Setup release tools
description: Install the Wails CLI and its native dependencies on Ubuntu 24.04
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
        pkg-config --modversion gtk4 webkitgtk-6.0
    - name: Install Wails CLI
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
