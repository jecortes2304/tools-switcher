version: '3'
info:
  companyName: "CorteStudios"
  productName: "tools-switcher"
  productIdentifier: "com.cortestudios.tools-switcher"
  description: "Gestiona tus herramientas de desarrollo"
  copyright: "Copyright 2026 CorteStudios"
  comments: ""
  version: "0.1.0"
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, artifacts]
    file: [.DS_Store, .gitignore, .gitkeep, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
